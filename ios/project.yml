name: Loop
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    LOOP_BUNDLE_PREFIX: com.example.loop
    LOOP_APP_GROUP: group.com.example.loop
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LoopApp:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: ../uhabits-core/assets/main/migrations
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_PREFIX).app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/LoopApp.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) LOOP_APP"
    dependencies:
      - target: LoopWidgets
        embed: true
      - framework: ../uhabits-ios-kit/build/XCFrameworks/release/LoopKit.xcframework
        embed: false
  LoopWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: ../uhabits-core/assets/main/migrations
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_PREFIX).app.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widgets/LoopWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - framework: ../uhabits-ios-kit/build/XCFrameworks/release/LoopKit.xcframework
        embed: false
  LoopAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: LoopApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LOOP_BUNDLE_PREFIX).app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/LoopApp.app/LoopApp
        BUNDLE_LOADER: $(TEST_HOST)
        # LoopKit is static and already linked into the host app. Tests only compile against the
        # module (-F) and resolve symbols from the host, avoiding a second Kotlin/Native runtime.
        "FRAMEWORK_SEARCH_PATHS[sdk=iphonesimulator*]": $(SRCROOT)/../uhabits-ios-kit/build/XCFrameworks/release/LoopKit.xcframework/ios-arm64-simulator
        "FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]": $(SRCROOT)/../uhabits-ios-kit/build/XCFrameworks/release/LoopKit.xcframework/ios-arm64
schemes:
  LoopApp:
    build:
      targets:
        LoopApp: all
        LoopWidgets: all
        LoopAppTests: [test]
    test:
      targets:
        - LoopAppTests
