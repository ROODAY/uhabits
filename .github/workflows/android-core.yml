name: android-core
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :uhabits-core:jvmTest :uhabits-core:jsTest :uhabits-ios-kit:jvmTest :uhabits-android:testDebugUnitTest :uhabits-android:assembleDebug
