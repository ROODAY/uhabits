name: ios
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Pick simulator
        run: |
          NAME=$(xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/^ +(.*) \([0-9A-F-]{36}\).*/\1/')
          [ -n "$NAME" ] || { echo "no iPhone simulator"; exit 1; }
          echo "Using simulator: $NAME"
          echo "SIM_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          cd ios
          xcodebuild test -project Loop.xcodeproj -scheme LoopApp \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
      - name: Screenshot
        run: |
          cd ios
          UDID=$(xcrun simctl list devices available | grep -F "$SIM_NAME (" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/Build/Products -maxdepth 2 -name LoopApp.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          xcrun simctl launch "$UDID" "$BID"
          sleep 5
          xcrun simctl io "$UDID" screenshot build/list.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          if-no-files-found: ignore
          path: ios/build/list.png
      - name: Upload xcresult on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ios/build/Logs/Test/*.xcresult
          if-no-files-found: ignore
  core-ios-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Run core tests on iOS simulator
        run: ./gradlew :uhabits-core:iosSimulatorArm64Test --no-daemon
