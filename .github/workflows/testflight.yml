name: testflight
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check required secrets and variables
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LOOP_BUNDLE_PREFIX: ${{ vars.LOOP_BUNDLE_PREFIX }}
          LOOP_APP_GROUP: ${{ vars.LOOP_APP_GROUP }}
        run: |
          missing=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID LOOP_BUNDLE_PREFIX LOOP_APP_GROUP; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty. See ios/SETUP.md step 6."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios
      - name: Build LoopKit XCFramework
        run: ./gradlew :uhabits-ios-kit:assembleLoopKitReleaseXCFramework --no-daemon
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LOOP_BUNDLE_PREFIX: ${{ vars.LOOP_BUNDLE_PREFIX }}
          LOOP_APP_GROUP: ${{ vars.LOOP_APP_GROUP }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          cd ios
          xcodebuild archive -project Loop.xcodeproj -scheme LoopApp             -configuration Release -destination 'generic/platform=iOS'             -archivePath build/Loop.xcarchive             -allowProvisioningUpdates             -authenticationKeyPath "$KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID"             LOOP_BUNDLE_PREFIX="$LOOP_BUNDLE_PREFIX"             LOOP_APP_GROUP="$LOOP_APP_GROUP"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/logs/archive.log"
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          cd ios
          cp ExportOptions.plist build/ExportOptions.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive             -archivePath build/Loop.xcarchive             -exportPath build/export             -exportOptionsPlist build/ExportOptions.plist             -allowProvisioningUpdates             -authenticationKeyPath "$KEY_PATH"             -authenticationKeyID "$ASC_KEY_ID"             -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/logs/export.log"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/logs/*.log
            ios/build/export/*.log
            ios/build/**/*.xcresult
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
