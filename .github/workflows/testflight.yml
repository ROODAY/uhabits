name: testflight
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']
jobs:
  upload:
    runs-on: macos-latest
    steps:
      - name: Check required secrets and variables
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          LOOP_BUNDLE_PREFIX: ${{ vars.LOOP_BUNDLE_PREFIX }}
          LOOP_APP_GROUP: ${{ vars.LOOP_APP_GROUP }}
        run: |
          missing=0
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID LOOP_BUNDLE_PREFIX LOOP_APP_GROUP; do
            if [ -z "${!n}" ]; then echo "::error::$n is empty. See ios/SETUP.md step 6."; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Build LoopKit XCFramework
        run: ./gradlew :uhabits-ios-kit:assembleLoopKitReleaseXCFramework --no-daemon
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: cd ios && xcodegen generate
      - name: Write API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd ios
          xcodebuild archive -project Loop.xcodeproj -scheme LoopApp \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Loop.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            LOOP_BUNDLE_PREFIX=${{ vars.LOOP_BUNDLE_PREFIX }} \
            LOOP_APP_GROUP=${{ vars.LOOP_APP_GROUP }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ios
          cp ExportOptions.plist build/ExportOptions.plist
          plutil -replace teamID -string "$APPLE_TEAM_ID" build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Loop.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
